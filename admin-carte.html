
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Direction — Éditeur Dynasty 8</title>

 
<link rel="stylesheet" href="agent.css">

<!-- Style de la carte Dynasty 8 -->
<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet" href="carte.css?v=prestige3">

  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="admin-carte.js" defer></script>
  
<style>
/* DYNASTY 8 — CORRECTION CARTE DIRECTION */

body:has(#direction-map:not([hidden])) {
  margin: 0;
  width: 100%;
  min-height: 100vh;
}

#direction-map {
  width: 100%;
  max-width: none;
  min-width: 0;
}

#direction-map[hidden] {
  display: none !important;
}

#direction-map .map-page {
  display: block;
  width: 100%;
  max-width: none;
  margin: 0;
  padding: 20px;
  box-sizing: border-box;
}

#direction-map .map-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  width: 100%;
}

#direction-map .map-toolbar button {
  width: auto;
  min-width: max-content;
  white-space: nowrap;
}

#direction-map .map-layout {
  position: relative;
  width: 100%;
  min-width: 0;
  min-height: 650px;
  overflow: hidden;
}

#direction-map #viewport {
  width: 100%;
  height: 650px;
  min-height: 650px;
}

#direction-map .map-buttons {
  position: absolute;
  z-index: 500;
}

#direction-map .map-buttons button {
  width: 44px;
  height: 44px;
}

#direction-map .zone-panel {
  box-sizing: border-box;
}
  
/* Donner toute la largeur à la carte Direction */
body:has(#direction-map:not([hidden])) .direction-main {
  display: block !important;
  width: 100% !important;
  max-width: none !important;
  min-width: 0;
  margin: 0 !important;
  padding: 0 !important;
  box-sizing: border-box;
}

/* Masquer le panneau de connexion après validation */
body:has(#direction-map:not([hidden])) #access-check {
  display: none !important;
}

/* Éviter que les styles Agent limitent la carte */
body:has(#direction-map:not([hidden])) #direction-map {
  display: block;
  width: 100%;
  max-width: none;
}

</style>

</head>

<body>
  <header>
    <a href="agent-dashboard.html">← ESPACE AGENT</a>
    <span>DYNASTY 8 · DIRECTION</span>
  </header>

  <main class="direction-main">
    <section class="login" id="access-check">
      <h1>Éditeur de <em>zones</em></h1>

      <p id="admin-message" role="status">
        Vérification de vos permissions Discord…
      </p>

      <div id="admin-actions" hidden>
        <a href="agent-login.html">
          Se connecter avec Discord
        </a>
      </div>
    
    </section>

    <!-- CARTE RÉSERVÉE À LA DIRECTION -->
    <section id="direction-map" hidden>

    <div class="map-page">

        <div class="map-toolbar" id="filters">
          <button class="on" data-type="all">Toutes les zones</button>
          <button data-type="lux">Villas de luxe</button>
          <button data-type="res">Résidentiel</button>
          <button data-type="biz">Commerces</button>
          <button data-type="ind">Garages</button>
          <button data-type="rural">Rural</button>
        </div>

        <div class="map-layout">

          <div class="map-viewport"
               id="viewport"></div>

          <div class="map-buttons">
            <button id="zoomIn">+</button>
            <button id="zoomOut">−</button>
            <button id="reset">⌂</button>
          </div>

          <div class="map-hint">
            Survolez ou cliquez sur une zone ·
            Faites glisser la carte pour vous déplacer
          </div>

          <aside class="zone-panel"
                 id="zonePanel"
                 aria-live="polite"></aside>

          <div class="map-credit">
            Carte GTA V non officielle ·
            Images © Rockstar Games ·
            Tuiles : VIRUXE
          </div>

        </div>
      </div>

    </section>

  </main>

  <!-- BIBLIOTHÈQUE LEAFLET -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</body>
</html>
