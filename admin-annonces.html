<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dynasty 8 — Éditeur des annonces</title><link rel="stylesheet" href="biens.css"><style>.admin{max-width:1000px;margin:30px auto;padding:18px}.admin h1{color:#dfb3ff}.notice{padding:13px;background:#30213c;border-left:4px solid #d6a3ff;font-size:13px;line-height:1.6}.layout{display:grid;grid-template-columns:270px 1fr;gap:20px;margin-top:20px}.panel{background:#1b1128;border:1px solid #74479e;border-radius:12px;padding:17px}.entry{display:block;width:100%;background:#29183c;color:white;border:1px solid #694393;border-radius:7px;padding:11px;text-align:left;margin:8px 0;cursor:pointer}.entry.active{background:#67339a}.panel label{display:block;margin-top:13px;color:#d7b8ed;font-size:13px}.panel input,.panel select,.panel textarea{display:block;width:100%;padding:10px;margin-top:5px;background:#100a19;color:white;border:1px solid #7953a2;border-radius:7px;font:inherit}.panel textarea{min-height:90px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.danger{background:#67253c}.status{color:#baffc6;font-size:13px}@media(max-width:650px){.layout{grid-template-columns:1fr}}</style><script src="supabase-config.js"></script><script src="supabase-client.js"></script></head><body><main class="admin"><div id="authGate" class="panel">Vérification de votre accès Agent Dynasty…</div><div id="agentEditor" style="display:none"><a href="agent-dashboard.html" style="color:#dab1ff">← Tableau de bord</a> · <a href="biens.html" style="color:#dab1ff">← Voir les annonces</a> · <a href="admin.html" style="color:#dab1ff">Éditeur des zones</a><h1>✦ ESPACE AGENT DYNASTY</h1><button class="adminbtn" id="logoutAgent">Déconnexion</button><p class="notice">Gestion des annonces en ligne · Accès réservé aux agents autorisés.</p><div class="layout"><aside class="panel"><button class="adminbtn" id="new">+ Nouvelle annonce</button><div id="entries"></div><hr><button class="adminbtn" id="export">Exporter les annonces JSON</button><label for="import">Importer un fichier JSON</label><input type="file" id="import" accept=".json,application/json"></aside><section class="panel"><form id="form"><input type="hidden" id="id"><label>Nom du bien<input id="name" required maxlength="100"></label><label>Type<select id="type"><option>Villa</option><option>Appartement</option><option>Commerce</option><option>Garage</option><option>Entrepôt</option><option>Terrain</option></select></label><label>Quartier<input id="area" required maxlength="100"></label><label>Prix ($)<input id="price" type="number" min="0" step="1" required></label><label>Surface (m²)<input id="surface" type="number" min="0" step="1" required></label><label>Adresse URL de la photo<input id="photo" type="url" placeholder="https://..."></label><label>Description<textarea id="description" maxlength="2000"></textarea></label><div class="actions"><button class="adminbtn" type="submit">Enregistrer</button><button class="adminbtn danger" type="button" id="delete">Supprimer</button></div><p class="status" id="status" aria-live="polite"></p></form></section></div></div></main><script src="supabase-client.js"></script><script src="annonces.js"></script><script src="admin-annonces.js"></script></body></html>
